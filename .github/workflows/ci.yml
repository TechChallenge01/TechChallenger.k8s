name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt (advisory)
        working-directory: terraform
        run: terraform fmt -check -recursive -diff || echo "::warning::terraform fmt pendente — rode 'terraform fmt -recursive'"

      - name: Terraform validate
        working-directory: terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate
